name: sea_lanka
description: AI-powered fishing companion for Sri Lankan fishermen
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4
  equatable: ^2.0.5

  # Dependency Injection
  get_it: ^8.0.0
  injectable: ^2.4.1

  # Navigation
  go_router: ^14.0.0

  # Networking
  dio: ^5.5.0
  pretty_dio_logger: ^1.4.0
  connectivity_plus: ^6.0.3

  # Maps
  google_maps_flutter: ^2.7.0
  flutter_map: ^7.0.2
  flutter_map_marker_cluster: ^1.3.6
  flutter_map_heatmap: ^0.0.8
  latlong2: ^0.9.1

  # Local Storage
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.0
  flutter_secure_storage: ^9.2.2

  # Code Generation
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # Functional
  dartz: ^0.10.1

  # Charts
  fl_chart: ^0.68.0

  # PDF Export
  pdf: ^3.11.1
  printing: ^5.13.1

  # Image picker
  image_picker: ^1.1.2

  # Permissions
  permission_handler: ^11.3.1

  # Location
  geolocator: ^12.0.0
  geocoding: ^3.0.0
  url_launcher: ^6.3.0
  flutter_compass: ^0.8.1

  # Auth
  google_sign_in: ^6.2.1
  # OTP SMS autofill -- Android's SMS User Consent API (a native consent
  # sheet the user taps once, no app-hash embedded in the SMS text needed)
  # and iOS's textContentType: .oneTimeCode. Wired into OtpInputWidget so
  # every OTP screen (verify-phone, forgot-password, OTP login) benefits.
  sms_autofill: ^2.4.0

  # Push notifications
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  # Utils
  intl: ^0.19.0
  logger: ^2.4.0
  cached_network_image: ^3.3.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.11
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  injectable_generator: ^2.6.1
  mockito: ^5.4.4
  bloc_test: ^9.1.7
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo/logo-mark.png"
  # Fish mark has transparent edges right up to the shape -- a flat navy
  # background (matches the app's own header gradient) instead of leaving
  # Android's adaptive-icon background transparent/white, which clips oddly.
  adaptive_icon_background: "#0A1F44"
  adaptive_icon_foreground: "assets/images/logo/logo-mark.png"

flutter:
  uses-material-design: true
  generate: true

  fonts:
    # Inter — display/UI + body (DS-sanctioned body fallback). Real TTFs.
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter/Inter-Bold.ttf
          weight: 700
    - family: NotoSansSinhala
      fonts:
        - asset: assets/fonts/NotoSansSinhala/NotoSansSinhala-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansSinhala/NotoSansSinhala-Bold.ttf
          weight: 700
    - family: NotoSansTamil
      fonts:
        - asset: assets/fonts/NotoSansTamil/NotoSansTamil-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansTamil/NotoSansTamil-Bold.ttf
          weight: 700

  assets:
    - assets/images/logo/
    - assets/images/illustrations/
    - assets/geojson/
